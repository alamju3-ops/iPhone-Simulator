<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iPhone 16 Simulator</title>
<script type="module" src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo",Arial,sans-serif;color:#111;background:#dfe2e8;--blue:#087eff;--panel:#fff;--muted:#8e8e93;--line:#e5e5ea}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:14px;background:linear-gradient(140deg,#e7eaf0,#cfd4de)}button,input,textarea{font:inherit}button{cursor:pointer;border:0}
.phone{position:relative;width:min(402px,100vw);height:min(874px,calc(100dvh - 28px));min-height:600px;overflow:hidden;border-radius:42px;background:#f2f2f7;box-shadow:0 22px 70px #0003;isolation:isolate}.wallpaper{position:absolute;inset:0;background:radial-gradient(ellipse at 15% 12%,#b2d8ff 0,transparent 35%),radial-gradient(ellipse at 80% 30%,#e6b8ed 0,transparent 38%),radial-gradient(ellipse at 55% 85%,#ffcfb9 0,transparent 38%),linear-gradient(150deg,#7898db,#b6b7ec 55%,#f5b9cb);z-index:-1}.status{height:51px;padding:13px 28px 0;display:flex;align-items:flex-start;justify-content:space-between;font-size:14px;font-weight:650;color:#17171b}.status-right{display:flex;gap:5px;align-items:center}.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:22px;background:#080808;z-index:5}.screen{position:absolute;inset:0;display:flex;flex-direction:column}.home{height:100%;display:flex;flex-direction:column}.widget{margin:14px 19px 20px;padding:17px 18px;border-radius:24px;background:#ffffff65;backdrop-filter:blur(20px);min-height:112px;display:flex;justify-content:space-between;align-items:center;color:#182039}.widget small{font-size:12px}.widget strong{display:block;font-size:37px;font-weight:400;letter-spacing:-2px}.widget .weather-icon{font-size:33px;color:#ffb544}.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:23px;padding:0 12px;align-content:start}.app-tile{display:flex;flex-direction:column;align-items:center;gap:6px;color:white;font-size:11px;text-shadow:0 1px 3px #0005;min-width:0}.app-icon{width:57px;height:57px;border-radius:15px;display:grid;place-items:center;box-shadow:0 3px 9px #0002;position:relative;color:white}.app-icon ion-icon{font-size:31px}.app-icon.light{color:#168bff}.app-icon.kakao{color:#241f00}.app-icon.calendar{background:#fff;color:#222}.calendar span{display:block;color:#ff3b30;font-size:9px;font-weight:700}.calendar b{font-size:25px;font-weight:400}.app-label{max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{position:absolute;right:-5px;top:-5px;border-radius:20px;background:#ff3b30;color:white;min-width:19px;height:19px;padding:0 5px;display:grid;place-items:center;font-size:11px;text-shadow:none;border:1px solid #fff}.spacer{flex:1}.dock{margin:10px 12px 23px;padding:12px 8px;border-radius:27px;background:#ffffff70;backdrop-filter:blur(24px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dock .app-icon{width:56px;height:56px}.app-window{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;z-index:3}.app-top{height:53px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid var(--line);flex-shrink:0}.app-top h2{font-size:18px;margin:0;font-weight:650}.back{background:transparent;color:var(--blue);display:flex;align-items:center;gap:3px;font-size:15px;padding:7px 0}.back ion-icon{font-size:23px}.top-action{color:var(--blue);background:transparent;font-size:15px;min-width:40px;text-align:right}.content{flex:1;overflow:auto;padding:15px;background:#f2f2f7}.section-title{font-size:13px;color:var(--muted);margin:8px 0 10px}.list{background:var(--panel);border-radius:13px;overflow:hidden}.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);min-height:58px;background:var(--panel);color:#17171b;text-align:left;width:100%}.row:last-child{border-bottom:0}.row .row-main{flex:1;min-width:0}.row strong{font-size:15px;font-weight:550;display:block}.row small{font-size:12px;color:var(--muted);display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row ion-icon{font-size:23px;color:var(--blue)}.avatar{width:42px;height:42px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:#c5d8f7;color:#fff;font-size:18px}.unread{background:var(--blue);color:#fff;border-radius:15px;padding:2px 7px;font-size:11px}.thread{flex:1;overflow:auto;padding:16px 13px;display:flex;flex-direction:column;gap:9px;background:#fff}.thread-info{text-align:center;color:#8e8e93;font-size:11px;margin:8px 0 15px}.bubble{max-width:82%;padding:10px 13px;border-radius:19px;font-size:16px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.in{align-self:flex-start;background:#e9e9eb;color:#111;border-bottom-left-radius:5px}.bubble.out{align-self:flex-end;background:#087eff;color:white;border-bottom-right-radius:5px}.compose{display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fafafa}.compose input,.field{min-width:0;flex:1;border:1px solid #d1d1d6;border-radius:22px;padding:10px 14px;background:#fff;outline:none;font-size:15px}.send{width:34px;height:34px;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center}.send ion-icon{font-size:20px}.form{display:flex;gap:8px;margin-bottom:12px}.form .field{border-radius:12px}.primary{border-radius:12px;background:var(--blue);color:#fff;padding:10px 14px;font-size:14px;white-space:nowrap}.note-card{padding:14px;background:white;border-radius:13px;margin-bottom:9px}.note-card h3{margin:0 0 7px;font-size:16px}.note-card p{margin:0;color:#555;white-space:pre-wrap;font-size:14px}.note-card .note-actions{display:flex;gap:15px;margin-top:10px}.note-actions button{background:transparent;color:var(--blue);font-size:13px}.searchbox{display:flex;align-items:center;gap:8px;background:white;border:1px solid #ddd;border-radius:22px;padding:9px 13px}.searchbox ion-icon{color:#777;font-size:20px}.searchbox input{border:0;outline:none;min-width:0;flex:1}.google{text-align:center;font-size:43px;font-weight:600;letter-spacing:-3px;margin:55px 0 30px;color:#4285f4}.google span:nth-child(2){color:#ea4335}.google span:nth-child(3){color:#fbbc05}.google span:nth-child(4){color:#4285f4}.google span:nth-child(5){color:#34a853}.google span:nth-child(6){color:#ea4335}.empty{text-align:center;color:var(--muted);padding:35px 10px;font-size:14px}.setting-switch{width:44px;height:26px;border-radius:20px;background:#d1d1d6;padding:3px;transition:.15s}.setting-switch:after{content:"";display:block;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0002}.setting-switch.on{background:#34c759}.setting-switch.on:after{margin-left:18px}.home-indicator{position:absolute;z-index:8;bottom:7px;left:50%;transform:translateX(-50%);width:135px;height:5px;border-radius:10px;background:#111;opacity:.85}.toast{position:absolute;z-index:20;left:20px;right:20px;bottom:40px;text-align:center;background:#202024;color:#fff;padding:12px;border-radius:12px;font-size:13px}
@media(max-width:430px){body{padding:0;background:#000}.phone{width:100vw;height:100dvh;min-height:550px;border-radius:0;box-shadow:none}.status{padding-top:13px}.island{top:10px}}
</style>
</head>
<body>
<div class="phone" id="phone"><div class="wallpaper"></div><div class="screen" id="screen"><div class="home" id="home">
<div class="status"><span id="clock">9:41</span><div class="island"></div><span class="status-right"><ion-icon name="cellular" style="font-size:15px"></ion-icon><ion-icon name="wifi" style="font-size:15px"></ion-icon><ion-icon name="battery-full" style="font-size:19px"></ion-icon></span></div>
<div class="widget"><div><small id="weather-location">서울</small><strong id="temp">18°</strong><small>대체로 맑음</small></div><div style="text-align:right"><ion-icon class="weather-icon" name="partly-sunny"></ion-icon><div style="font-size:12px;margin-top:6px">최고 21° · 최저 13°</div></div></div>
<div class="grid" id="app-grid"></div><div class="spacer"></div><div class="dock" id="dock"></div></div></div><div class="home-indicator"></div></div>
<script>
const $=s=>document.querySelector(s);
const appDefs=[
{id:'Phone',label:'전화',icon:'call',color:'#34c759'},{id:'Messages',label:'메시지',icon:'chatbubble',color:'#32d74b',badge:true},{id:'Safari',label:'Safari',icon:'compass',color:'#eaf4ff',light:true},{id:'Camera',label:'카메라',icon:'camera',color:'#38383d'},
{id:'Photos',label:'사진',icon:'aperture',color:'#fff',light:true},{id:'Calendar',label:'캘린더',icon:'calendar',color:'#fff',calendar:true},{id:'Clock',label:'시계',icon:'time',color:'#202024'},{id:'Weather',label:'날씨',icon:'partly-sunny',color:'#4ca8ff'},
{id:'Maps',label:'지도',icon:'map',color:'#fff',light:true},{id:'Notes',label:'메모',icon:'document-text',color:'#ffe45c',light:true},{id:'Contacts',label:'연락처',icon:'person',color:'#f4f4f7',light:true},{id:'Mail',label:'메일',icon:'mail',color:'#1689ff'},
{id:'YouTube',label:'YouTube',icon:'logo-youtube',color:'#ff0033'},{id:'KakaoTalk',label:'카카오톡',icon:'chatbubble-ellipses',color:'#fee500',kakao:true,badge:true},{id:'Spotify',label:'Spotify',icon:'musical-notes',color:'#1ed760',light:true},{id:'Settings',label:'설정',icon:'settings',color:'#8e8e93'}];
let chats=JSON.parse(localStorage.getItem('sim-chats')||'null')||[
{id:1,name:'민서',preview:'오늘 몇 시에 만날까?',time:'오후 2:18',unread:2,icon:'M',color:'#d6a9c4',msgs:[{from:'in',text:'지금 뭐 해?',time:'오후 2:12'},{from:'out',text:'집에서 준비하고 있어.',time:'오후 2:14'},{from:'in',text:'오늘 몇 시에 만날까?',time:'오후 2:18'}]},
{id:2,name:'가족',preview:'사진 보내 줘',time:'오후 1:42',unread:0,icon:'가',color:'#d9b38c',msgs:[{from:'in',text:'주말에 다 같이 저녁 먹자.',time:'오후 1:30'}]},
{id:3,name:'지우',preview:'확인했어. 고마워!',time:'어제',unread:0,icon:'지',color:'#91aedd',msgs:[{from:'in',text:'자료 보내 줘서 고마워.',time:'어제'}]},
{id:4,name:'학교 단체방',preview:'서연: 과제 파일 올렸어',time:'어제',unread:4,icon:'학',color:'#b5a0e3',msgs:[{from:'in',text:'과제 파일 올렸어.',time:'어제'}]}];
let notes=JSON.parse(localStorage.getItem('sim-notes')||'null')||[{id:1,title:'아이디어',body:'오늘 해야 할 일 정리하기'},{id:2,title:'메모',body:'잊지 말고 챙기기'}];
let contacts=JSON.parse(localStorage.getItem('sim-contacts')||'null')||['민서','가족','지우','서연'];
let history=JSON.parse(localStorage.getItem('sim-history')||'[]'),active=null,chatId=null,editNoteId=null,searchQuery='',dark=false,wifi=true,bluetooth=true;
function persist(){localStorage.setItem('sim-chats',JSON.stringify(chats));localStorage.setItem('sim-notes',JSON.stringify(notes));localStorage.setItem('sim-contacts',JSON.stringify(contacts));localStorage.setItem('sim-history',JSON.stringify(history))}
function icon(name){return '<ion-icon name="'+name+'"></ion-icon>'}
function tile(a){let inner=a.calendar?'<div class="calendar"><span>일요일</span><b>'+new Date().getDate()+'</b></div>':icon(a.icon);let badge=a.badge&&a.id==='Messages'&&chats.reduce((n,c)=>n+c.unread,0)?'<span class="badge">'+chats.reduce((n,c)=>n+c.unread,0)+'</span>':a.badge&&a.id==='KakaoTalk'?'<span class="badge">3</span>':'';return '<button class="app-tile" data-app="'+a.id+'"><span class="app-icon '+(a.light?'light ':'')+(a.kakao?'kakao ':'')+'" style="background:'+a.color+'">'+inner+badge+'</span><span class="app-label">'+a.label+'</span></button>'}
function drawHome(){$('#app-grid').innerHTML=appDefs.filter(a=>!['Phone','Messages','Safari','Music'].includes(a.id)).map(tile).join('');$('#dock').innerHTML=appDefs.filter(a=>['Phone','Messages','Safari','Spotify'].includes(a.id)).map(tile).join('');document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app))}
function top(title,right=''){return '<div class="app-top"><button class="back" data-back>'+icon('chevron-back')+'<span>홈</span></button><h2>'+title+'</h2><button class="top-action" id="top-action">'+right+'</button></div>'}
function frame(title,body,right=''){return '<section class="app-window">'+top(title,right)+'<div class="content">'+body+'</div></section>'}
function row(iconName,title,sub='',right=''){return '<div class="row">'+icon(iconName)+'<div class="row-main"><strong>'+esc(title)+'</strong>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>'+right+'</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openApp(id){active=id;chatId=null;renderApp()}
function back(){if(chatId!==null){chatId=null;renderApp()}else{active=null;$('#screen').innerHTML=$('#screen').innerHTML;drawHome();$('#screen').querySelector('.app-window')?.remove()}}
function renderApp(){if(!active)return;$('#screen').querySelector('.app-window')?.remove();let title=appDefs.find(a=>a.id===active)?.label||active,html='';
if(active==='Messages'||active==='KakaoTalk'){
 if(chatId!==null){const c=chats.find(c=>c.id===chatId);if(!c){chatId=null;return renderApp()}c.unread=0;persist();html='<section class="app-window" style="background:#fff">'+top(c.name,icon('call-outline'))+'<div style="text-align:center;padding:12px;color:#8e8e93;font-size:12px">대화 · '+esc(c.name)+'</div><div class="thread" id="thread"><div class="thread-info">메시지 및 통화는 이 기기 안에서만 저장됩니다.</div>'+c.msgs.map(m=>'<div class="bubble '+m.from+'">'+esc(m.text)+'</div>').join('')+'</div><form class="compose" id="send-form"><input id="message-input" placeholder="iMessage" autocomplete="off"><button class="send" aria-label="보내기">'+icon('arrow-up')+'</button></form></section>'}
 else{html=frame(title,'<div class="form"><input class="field" id="new-chat" placeholder="새로운 대화 상대"><button class="primary" id="create-chat">작성</button></div><div class="list">'+chats.map(c=>'<button class="row" data-chat="'+c.id+'"><span class="avatar" style="background:'+c.color+'">'+esc(c.icon||c.name[0])+'</span><span class="row-main"><strong>'+esc(c.name)+'</strong><small>'+esc(c.preview)+'</small></span><small style="color:#8e8e93">'+esc(c.time)+'</small>'+(c.unread?'<span class="unread">'+c.unread+'</span>':'')+'</button>').join('')+'</div>','편집')}
}else if(active==='Notes'){html=frame('메모','<div class="form"><input id="note-title" class="field" placeholder="제목"><button id="save-note" class="primary">추가</button></div><textarea id="note-body" class="field" style="width:100%;height:95px;resize:vertical;border-radius:12px" placeholder="메모 내용을 입력하세요"></textarea><div style="height:14px"></div>'+notes.map(n=>'<div class="note-card"><h3>'+esc(n.title||'제목 없음')+'</h3><p>'+esc(n.body)+'</p><div class="note-actions"><button data-edit-note="'+n.id+'">편집</button><button data-delete-note="'+n.id+'">삭제</button></div></div>').join(''),'완료')}
else if(active==='Contacts'){html=frame('연락처','<div class="form"><input id="new-contact" class="field" placeholder="이름 입력"><button id="add-contact" class="primary">추가</button></div><div class="list">'+contacts.map(c=>'<div class="row"><span class="avatar">'+esc(c[0])+'</span><span class="row-main"><strong>'+esc(c)+'</strong><small>연락처</small></span></div>').join('')+'</div>')}
else if(active==='Safari'){html=frame('Safari','<div class="google"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div><form id="search-form" class="searchbox">'+icon('search')+'<input id="google-query" placeholder="Google 검색 또는 URL 입력"><button class="top-action">검색</button></form><p class="section-title" style="margin-top:25px">최근 검색</p><div class="list">'+history.map(q=>'<button class="row" data-history="'+esc(q)+'">'+icon('time-outline')+'<span class="row-main">'+esc(q)+'</span></button>').join('')+'</div><div id="search-result"></div>')}
else if(active==='Settings'){html=frame('설정','<div class="list">'+[['person-circle','Apple 계정','로그인 및 개인 정보'],['wifi','Wi-Fi',wifi?'연결됨':'끔'],['bluetooth','Bluetooth',bluetooth?'켬':'끔'],['moon','다크 모드',dark?'켬':'끔'],['notifications','알림','알림 설정'],['general','일반','소프트웨어 업데이트 및 기기 정보']].map((x,i)=>'<button class="row" data-setting="'+i+'">'+icon(x[0])+'<span class="row-main"><strong>'+x[1]+'</strong><small>'+x[2]+'</small></span>'+(i>=1&&i<=3?'<span class="setting-switch '+((i===1?wifi:i===2?bluetooth:dark)?'on':'')+'"></span>':icon('chevron-forward')).replace('undefined','')+'</button>').join('')+'</div><p class="section-title" style="margin-top:18px">iPhone 16 · 웹 시뮬레이터</p>')}
else if(active==='Phone'){html=frame('전화','<div class="list">'+['즐겨찾기','최근 통화','연락처','키패드','음성 사서함'].map((x,i)=>'<button class="row">'+icon(['star','time','person-circle','keypad','voicemail'][i])+'<span class="row-main"><strong>'+x+'</strong></span>'+icon('chevron-forward')+'</button>').join('')+'</div>')}
else if(active==='YouTube'){html=frame('YouTube','<div class="form"><input id="yt-query" class="field" placeholder="YouTube 검색"><button id="yt-search" class="primary">검색</button></div><div id="yt-results"><div class="empty">검색어를 입력하면 예시 검색 결과가 표시됩니다.</div></div>')}
else if(active==='Spotify'){html=frame('Spotify','<h2 style="font-size:25px;margin:10px 0 20px">좋은 하루를 위한 음악</h2><div class="list">'+[['musical-notes','오늘의 추천 믹스'],['headset','집중할 때 듣는 음악'],['radio','나만의 플레이리스트']].map(x=>'<button class="row" data-play="'+x[1]+'">'+icon(x[0])+'<span class="row-main"><strong>'+x[1]+'</strong></span>'+icon('play-circle')+'</button>').join('')+'</div><p class="section-title">미리보기 화면 · 실제 Spotify 계정에 연결되지 않습니다.</p>')}
else if(active==='Calendar'){html=frame('캘린더','<div class="note-card"><h3>'+new Date().getFullYear()+'년 '+(new Date().getMonth()+1)+'월</h3><p>'+new Date().getDate()+'일 · 오늘</p></div>')}
else if(active==='Clock'){html=frame('시계','<div class="note-card"><h3>서울</h3><p id="live-clock" style="font-size:36px">'+new Date().toLocaleTimeString('ko-KR')+'</p></div>')}
else if(active==='Weather'){html=frame('날씨','<div class="note-card"><h3>서울 · 18°</h3><p>대체로 맑음<br>최고 21° · 최저 13°</p></div>')}
else if(active==='Maps'){html=frame('지도','<div class="note-card" style="height:340px;background:linear-gradient(35deg,#d7e8d1,#f6f0df,#d7e8d1);display:grid;place-items:center"><p>지도 미리보기</p></div><p class="section-title">실제 위치 정보에 연결되지 않습니다.</p>')}
else if(active==='Photos'){html=frame('사진','<div class="empty">사진 보관함이 비어 있습니다.</div>')}
else if(active==='Camera'){html=frame('카메라','<div style="height:70%;background:#17171b;border-radius:18px;display:grid;place-items:center;color:white">'+icon('camera-outline')+'</div><p class="section-title">카메라 미리보기 · 실제 촬영 기능은 제공하지 않습니다.</p>')}
else if(active==='Mail'){html=frame('메일','<div class="empty">받은 편지함에 메일이 없습니다.</div>')}
else{html=frame(title,'<div class="empty">'+esc(title)+' 앱 미리보기</div>')}
$('#screen').insertAdjacentHTML('beforeend',html);$('#screen').querySelectorAll('[data-back]').forEach(b=>b.onclick=back);
if(active==='Messages'||active==='KakaoTalk'){if(chatId!==null){const thread=$('#thread');thread.scrollTop=thread.scrollHeight;$('#send-form').onsubmit=e=>{e.preventDefault();let v=$('#message-input').value.trim();if(!v)return;let c=chats.find(c=>c.id===chatId);c.msgs.push({from:'out',text:v,time:new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})});c.preview=v;c.time='지금';persist();renderApp()}}else{$('#create-chat').onclick=()=>{let name=$('#new-chat').value.trim();if(!name)return;let c={id:Date.now(),name,preview:'새로운 대화',time:'지금',unread:0,icon:name[0],color:'#91aedd',msgs:[]};chats.unshift(c);persist();chatId=c.id;renderApp()};$('#screen').querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{chatId=Number(b.dataset.chat);renderApp()})}}
if(active==='Notes'){$('#save-note').onclick=()=>{let title=$('#note-title').value.trim(),body=$('#note-body').value.trim();if(!title&&!body)return;if(editNoteId){let n=notes.find(n=>n.id===editNoteId);n.title=title;n.body=body;editNoteId=null;$('#save-note').textContent='추가'}else notes.unshift({id:Date.now(),title,body});persist();renderApp()};$('#screen').querySelectorAll('[data-delete-note]').forEach(b=>b.onclick=()=>{notes=notes.filter(n=>n.id!==Number(b.dataset.deleteNote));persist();renderApp()});$('#screen').querySelectorAll('[data-edit-note]').forEach(b=>b.onclick=()=>{let n=notes.find(n=>n.id===Number(b.dataset.editNote));editNoteId=n.id;$('#note-title').value=n.title;$('#note-body').value=n.body;$('#save-note').textContent='저장'})}
if(active==='Contacts')$('#add-contact').onclick=()=>{let v=$('#new-contact').value.trim();if(v&&!contacts.includes(v)){contacts.push(v);persist();renderApp()}};
if(active==='Safari'){$('#search-form').onsubmit=e=>{e.preventDefault();let q=$('#google-query').value.trim();if(!q)return;history=[q,...history.filter(x=>x!==q)].slice(0,10);persist();$('#search-result').innerHTML='<div class="note-card" style="margin-top:15px"><h3>검색어: '+esc(q)+'</h3><p>이 시뮬레이터에서는 검색 기록만 저장합니다. 실제 Google 검색 결과는 연결되지 않습니다.</p></div>';renderApp();$('#google-query').value=q};$('#screen').querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{$('#google-query').value=b.dataset.history})}
if(active==='Settings')$('#screen').querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.setting);if(i===1)wifi=!wifi;if(i===2)bluetooth=!bluetooth;if(i===3)dark=!dark;if(i===3){document.documentElement.style.setProperty('--panel',dark?'#242426':'#fff');document.documentElement.style.setProperty('--line',dark?'#3a3a3c':'#e5e5ea')}renderApp()});
if(active==='YouTube')$('#yt-search').onclick=()=>{let q=$('#yt-query').value.trim();$('#yt-results').innerHTML=q?'<div class="note-card"><div style="height:120px;background:#e3e3e8;border-radius:10px;display:grid;place-items:center;font-size:34px;color:#f03">▶</div><h3 style="margin-top:10px">'+esc(q)+'</h3><p>검색 미리보기 · 실제 YouTube 결과에 연결되지 않습니다.</p></div>':'<div class="empty">검색어를 입력하세요.</div>'};
if(active==='Spotify')$('#screen').querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>toast(b.dataset.play+' 재생 미리보기'));
if(active==='Clock')setInterval(()=>{let el=$('#live-clock');if(el&&active==='Clock')el.textContent=new Date().toLocaleTimeString('ko-KR')},1000);
}
function toast(msg){let el=document.createElement('div');el.className='toast';el.textContent=msg;$('#phone').append(el);setTimeout(()=>el.remove(),1800)}
function updateClock(){$('#clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}
drawHome();updateClock();setInterval(updateClock,15000);
</script>
</body></html>
